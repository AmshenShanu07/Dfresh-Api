name: Deploy NestJS to EC2

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm ci

      - name: Build NestJS app
        run: npm run build

      - name: Archive build
        if: github.event_name == 'push'
        run: |
          tar -czf build.tar.gz dist package.json package-lock.json

      - name: Verify deploy secrets are present
        if: github.event_name == 'push'
        run: |
          missing=""
          if [ -z "${{ secrets.EC2_HOST }}" ];    then missing="$missing EC2_HOST";    fi
          if [ -z "${{ secrets.EC2_USER }}" ];    then missing="$missing EC2_USER";    fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then missing="$missing EC2_SSH_KEY"; fi
          if [ -z "${{ secrets.APP_PATH }}" ];    then missing="$missing APP_PATH";    fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Set them under Settings > Secrets and variables > Actions in this repository."
            exit 1
          fi
          echo "All deploy secrets present."

      - name: Upload build to EC2
        if: github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build.tar.gz"
          target: "/tmp"

      - name: Deploy on EC2
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.APP_PATH }}
            rm -rf dist
            tar -xzf /tmp/build.tar.gz -C .
            pm2 kill
            pm2 start "node --max-old-space-size=2048 ./dist/main.js" --name api
